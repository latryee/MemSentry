name: MemSentry CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Lint & Format Check (clang-format & clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM / Clang Tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-16 clang-tidy-16

      - name: Check Formatting
        run: |
          find include src examples tests fuzz -type f \( -name "*.hpp" -o -name "*.cpp" \) -exec clang-format-16 --dry-run --Werror {} +

  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
          - os: windows-latest
            compiler: msvc
            build_type: Release
          - os: windows-latest
            compiler: msvc
            build_type: Debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMEMSENTRY_BUILD_TESTS=ON
          -DMEMSENTRY_BUILD_EXAMPLES=ON

      - name: Build MemSentry
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Verify Zero-Dependency (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Checking shared library dependencies for Linux binaries..."
          for bin in build/test_suite build/test_tracker build/test_canary build/test_untracked_fallback build/test_c_alloc_hooks build/test_canary_race build/test_sanitizer_matrix build/test_suppression build/test_realloc build/test_fragmentation build/test_sampling build/test_watchdog; do
            if [ -f "$bin" ]; then
              echo "Inspecting $bin:"
              ldd "$bin"
              unexpected=$(ldd "$bin" | grep -vE 'linux-vdso\.so|libstdc\+\+\.so|libgcc_s\.so|libc\.so|libm\.so|libpthread\.so|ld-linux' || true)
              if [ -n "$unexpected" ]; then
                echo "Error: Unexpected external dependencies found in $bin:"
                echo "$unexpected"
                exit 1
              fi
            fi
          done
          echo "Zero-dependency check passed on Linux."

      - name: Verify Zero-Dependency (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Checking dynamic library dependencies for macOS binaries..."
          for bin in build/test_suite build/test_tracker build/test_canary build/test_untracked_fallback build/test_c_alloc_hooks build/test_canary_race build/test_sanitizer_matrix build/test_suppression build/test_realloc build/test_fragmentation build/test_sampling build/test_watchdog; do
            if [ -f "$bin" ]; then
              echo "Inspecting $bin:"
              otool -L "$bin"
              unexpected=$(otool -L "$bin" | tail -n +2 | grep -vE 'libc\+\+\.1\.dylib|libSystem\.B\.dylib' || true)
              if [ -n "$unexpected" ]; then
                echo "Error: Unexpected external dependencies found in $bin:"
                echo "$unexpected"
                exit 1
              fi
            fi
          done
          echo "Zero-dependency check passed on macOS."

      - name: Run Tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --verbose

  sanitizers:
    name: Sanitizers (ASan, UBSan, TSan) - Linux Clang
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ASan & UBSan
        run: >
          cmake -B build-asan
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DMEMSENTRY_ENABLE_ASAN=ON
          -DMEMSENTRY_BUILD_TESTS=ON
          -DMEMSENTRY_BUILD_EXAMPLES=OFF

      - name: Build & Run ASan
        env:
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=0:verify_asan_link_order=0"
          UBSAN_OPTIONS: "print_stacktrace=1"
        run: |
          cmake --build build-asan --parallel
          ctest --test-dir build-asan -R "test_tracker|test_suite|test_untracked_fallback|test_c_alloc_hooks|test_suppression|test_fragmentation|test_sampling|test_watchdog" --output-on-failure

      - name: Configure TSan
        run: >
          cmake -B build-tsan
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DMEMSENTRY_ENABLE_TSAN=ON
          -DMEMSENTRY_BUILD_TESTS=ON
          -DMEMSENTRY_BUILD_EXAMPLES=OFF

      - name: Build & Run TSan
        env:
          TSAN_OPTIONS: "suppress_equal_stacks=1:halt_on_error=1"
        run: |
          cmake --build build-tsan --parallel
          ctest --test-dir build-tsan -R "test_tracker|test_suite|test_untracked_fallback|test_c_alloc_hooks|test_suppression|test_fragmentation|test_sampling|test_watchdog" --output-on-failure

  coverage:
    name: Code Coverage (GCC + Codecov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Configure CMake with Coverage
        run: >
          cmake -B build-cov
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Debug
          -DMEMSENTRY_ENABLE_COVERAGE=ON
          -DMEMSENTRY_BUILD_TESTS=ON
          -DMEMSENTRY_BUILD_EXAMPLES=OFF

      - name: Build Tests
        run: cmake --build build-cov --parallel

      - name: Execute Test Matrix for Coverage
        run: ctest --test-dir build-cov --output-on-failure

      - name: Generate Coverage Report
        run: |
          gcovr --root . build-cov --filter 'src/' --filter 'include/' --xml coverage.xml --print-summary || gcovr -r . --xml coverage.xml || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
